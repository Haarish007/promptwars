version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://PentagonPulse:JAHvoBMzrIb1QslN2dzj@db:5432/anchor
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=PentagonPulse
      - POSTGRES_PASSWORD=JAHvoBMzrIb1QslN2dzj
      - POSTGRES_DB=anchor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PentagonPulse -d anchor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
