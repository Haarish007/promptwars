# CodeRabbit skips automatic reviews on public repos with fewer than 10 stars.
# This workflow posts the official review command so every non-draft PR is reviewed.
name: Auto CodeRabbit Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  trigger-review:
    name: Request CodeRabbit review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Comment CodeRabbit review command
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODERABBIT_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const action = context.payload.action;
            const body = action === 'synchronize'
              ? '@coderabbitai review'
              : '@coderabbitai full review';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
